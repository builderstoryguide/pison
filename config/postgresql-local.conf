# DCMS - PostgreSQL local optimization
# Copy these settings into postgresql.conf or use: include = 'path/to/config/postgresql-local.conf'
# Restart PostgreSQL after changing shared_buffers or effective_cache_size.

# Memory (adjust for your RAM: 25% and 75% of total)
# 4GB RAM: 1GB / 3GB | 8GB RAM: 2GB / 6GB | 16GB RAM: 4GB / 12GB
shared_buffers = 2GB
effective_cache_size = 6GB

# Sort and hash operations
work_mem = 16MB

# Index creation, VACUUM
maintenance_work_mem = 64MB

# Spread checkpoint I/O
checkpoint_completion_target = 0.9
